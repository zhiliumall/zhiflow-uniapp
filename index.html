<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E86128" />
  <title>%VITE_MALL_NAME%</title>
  <link rel="icon" href="/static/h5/favicon.ico" />
  <style>
    page,uni-page{background-color:#fff;font-size:28upx;color:#0A1633;font-family:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif}
    body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    #app{min-height:100vh}
  </style>
  <!--
    公众号网页授权回跳时的「正在登录…」整屏过渡层：授权只能整页跳去微信再跳回来，
    回跳是冷启动，应用 JS 起来之前整屏是白的。这里在 head 里判定「这是一次登录回跳」，
    给 <html> 打 lv-boot，首帧即盖住；目标页挂出来后由 body 里的脚本揭开。
    state 口径与 App.vue 一致：只有 snsapi_base / snsapi_userinfo 会换登录态。
  -->
  <script>
    (function () {
      var root = document.documentElement;
      var q = location.search;
      var st = (q.match(/[?&]state=([^&#]*)/) || [])[1];
      if (/micromessenger/i.test(navigator.userAgent) && /[?&]code=/.test(q) &&
          (st === "snsapi_userinfo" || st === "snsapi_base")) {
        root.classList.add("lv-boot");
      }
    })();
  </script>
  <style>
    #login-veil{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10001;display:none;flex-direction:column;align-items:center;justify-content:center;background:#fff;opacity:0;transition:opacity .15s ease}
    #login-veil.lv-on,html.lv-boot #login-veil{display:flex}
    #login-veil.lv-in,html.lv-boot #login-veil{opacity:1}
    #login-veil.lv-out{transition-duration:.22s}
    #login-veil .lv-spin{display:block;width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:3px solid var(--lv-c,#E86128);border-right-color:transparent;animation:lv-spin .8s linear infinite}
    #login-veil .lv-txt{margin-top:12px;font-size:14px;line-height:1.4;color:#5A6B8C;letter-spacing:.5px}
    html[data-scale="large"] #login-veil .lv-txt{font-size:16px}
    @keyframes lv-spin{to{transform:rotate(360deg)}}
  </style>
  <script>
    /* 禁止 Safari 页面缩放:
       viewport 里的 user-scalable=no / maximum-scale 自 iOS 10 起被 Safari 忽略
       (无障碍考量,Android/微信内置浏览器仍生效),故需 JS 兜底。旧版只拦 gesture*+双击,
       在多数 iOS 版本上仍能捏合放大 —— 补上更可靠的多指 touchmove 主拦截。
       1) touchmove 出现 ≥2 指 = 捏合,直接 preventDefault(最可靠,仅多指时生效,
          单指滑动/滚动/滑块验证码不受影响);
       2) gesture* 是 Safari 专有的双指捏合事件(含桌面触控板),一并 preventDefault;
       3) wheel + ctrlKey = 触控板捏合/Ctrl+滚轮缩放(桌面 Safari),preventDefault 拦截;
       4) touchend 在 300ms 内二次触发 = 双击,preventDefault 拦截双击放大。
       统一用 捕获阶段 + passive:false,避免内层元素 stopPropagation 造成漏拦。
       注:键盘 Cmd/Ctrl +/- 属浏览器级缩放,JS 无法可靠拦截,不在此处理。 */
    (function () {
      var opt = { passive: false, capture: true };
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, opt);
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
        document.addEventListener(evt, function (e) { e.preventDefault(); }, opt);
      });
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) e.preventDefault();
      }, opt);
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
</head>
<body>
  <div id="login-veil" role="status" aria-live="polite"><i class="lv-spin" aria-hidden="true"></i><span class="lv-txt">正在登录…</span></div>
  <script>
    // 过渡层开关。window.__LOGIN_VEIL__ 供 utils/login-veil.js 调用：
    //   show —— 跳微信授权之前（utils/gbfn.js）；
    //   hide —— 换码失败 / 留在原页的登录成功（App.vue）、回跳但不归登录页收尾（login/index.vue）。
    // 回跳落地（lv-boot）时自己盯着地址：离开落地页（登录页收尾跳去目标页 / 去绑手机）即揭开。
    // 揭开前先等当前页挂出内容，免得掀开的是一块还没画的白页；任何漏掉的路径 12 秒后自动揭开。
    (function () {
      var root = document.documentElement;
      var veil = document.getElementById("login-veil");
      if (!veil) return;
      var guard = null, seq = 0;
      function pageReady() {
        var p = location.pathname.replace(/^\/+/, "");
        var el = document.querySelector(p ? 'uni-page[data-page="' + p + '"]' : "uni-page");
        return !!(el && el.childElementCount);
      }
      function show() {
        clearTimeout(guard);
        seq++;
        veil.classList.remove("lv-out");
        veil.classList.add("lv-on");
        void veil.offsetWidth;
        veil.classList.add("lv-in");
        guard = setTimeout(hide, 12000);
      }
      function hide() {
        clearTimeout(guard);
        if (!veil.classList.contains("lv-on") && !root.classList.contains("lv-boot")) return;
        var my = ++seq, t0 = Date.now();
        (function wait() {
          if (my !== seq) return;
          if (!pageReady() && Date.now() - t0 < 3000) { requestAnimationFrame(wait); return; }
          veil.classList.add("lv-on", "lv-in");
          root.classList.remove("lv-boot");
          requestAnimationFrame(function () {
            if (my !== seq) return;
            veil.classList.add("lv-out");
            veil.classList.remove("lv-in");
            setTimeout(function () {
              if (my === seq) veil.classList.remove("lv-on", "lv-out");
            }, 240);
          });
        })();
      }
      // 从微信授权页「返回」、页面被 bfcache 原样恢复：揭开
      window.addEventListener("pageshow", function (e) { if (e.persisted) hide(); });
      window.__LOGIN_VEIL__ = { show: show, hide: hide };

      if (!root.classList.contains("lv-boot")) return;
      guard = setTimeout(hide, 12000);
      var from = location.pathname;
      function onRoute() { if (location.pathname !== from) hide(); }
      ["pushState", "replaceState"].forEach(function (m) {
        var orig = history[m];
        history[m] = function () {
          var r = orig.apply(this, arguments);
          setTimeout(onRoute, 0);
          return r;
        };
      });
      window.addEventListener("popstate", onRoute);
    })();
  </script>
  <div id="app" role="main"><!--app-html--></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
